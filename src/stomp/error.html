<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Page unavailable</title>
		<style>
			:root {
				color-scheme: dark;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font:
					16px/1.5 system-ui,
					sans-serif;
				color: #f2f2f2;
				background: #1a1a1a;
			}
			main {
				max-width: 32rem;
				padding: 2rem;
				border-radius: 1rem;
				background: #ffffff10;
				box-shadow: inset 0 0 0 1px #ffffff14;
			}
			h1 {
				margin: 0 0 0.5rem;
				font-size: 1.5rem;
			}
			p {
				margin: 0.5rem 0;
				color: #cfcfcf;
			}
			code {
				word-break: break-all;
				color: #f2f2f2;
			}
			button {
				margin-top: 1rem;
				padding: 0.5rem 1.25rem;
				border: 0;
				border-radius: 999px;
				font: inherit;
				font-weight: 600;
				color: #1a1a1a;
				background: #fb74fe;
				cursor: pointer;
			}
			button:hover {
				filter: brightness(1.1);
			}
		</style>
	</head>
	<body>
		<!--
			The proxy engine's error page (its errorPage option). The engine's
			service worker serves this under the frame's URL for a document it
			failed to produce, with the failure in a script in the head
			(globalThis.<names.error> = { url, status, error, kind }); reloading
			retries the real page. The global's name is minted per build with the
			engine's other helper names (vite.config.ts) and written into this file
			when it is copied to dist/vendor/rt/err.html, so the contract never
			carries the engine's name and the obfuscator has no literal to touch.
			Standalone like uncloak-client.js: no app code, no framework. The
			strings are plain because this document is not part of the app bundle
			and names nothing about the host.
		-->
		<main>
			<h1 id="title">Page unavailable</h1>
			<p>This page could not be loaded: <code id="url"></code></p>
			<p id="detail"></p>
			<button id="retry" type="button">Retry</button>
		</main>
		<script>
			const info = globalThis.__STOMP_ERROR_NAME__ || {};
			const titles = {
				transport: "Could not reach the site",
				timeout: "The site took too long",
				routing: "Something went wrong",
				blocked: "Blocked",
				refused: "Not available here",
				controller: "This tab needs a reload",
			};
			document.getElementById("title").textContent = titles[info.kind] || "Page unavailable";
			document.getElementById("url").textContent = info.url || location.href;
			document.getElementById("detail").textContent = info.error ? `${info.kind || "error"}${info.status ? ` (${info.status})` : ""}: ${info.error}` : "";
			document.getElementById("retry").addEventListener("click", () => location.reload());
		</script>
	</body>
</html>
