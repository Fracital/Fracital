name: "Biome Code Quality Assurance"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: "ubuntu-latest"

    permissions:
      contents: "write"

    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v5"

      - name: "Setup Biome"
        uses: "biomejs/setup-biome@v2"
        # No `version` here on purpose: the action then uses the repo's pinned
        # Biome (package.json/lockfile). "latest" formatted differently than
        # the project's Biome, so the bot found phantom drift on every push.

      - name: "Format with Biome"
        run: "biome format --write ."

      - name: "Check for Git changes"
        id: "verify-changed-files"
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # Push events on main keep the old behavior: the bot commits the fix.
      # Pull requests never write back — a PR runs untrusted code, and a
      # contents:write token must not touch it. PRs just fail the check and
      # tell the author to run `npm run format`.
      - name: "Commit and push (main pushes only)"
        if: steps.verify-changed-files.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "chore: auto-fix formatting with Biome"
          git push

      - name: "Fail if formatting was needed"
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Formatting differs from main. Run 'npm run format' and push again."
          else
            echo "Biome formatting changes were needed; committed and pushed. Pull the latest changes."
          fi
          exit 1
