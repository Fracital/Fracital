# Build every push to `dev`, then deploy it to dev.fracit.al (pm2 `fracital-dev` on terp :8090).
#
# Same TERP_DEPLOY_KEY and forced-command gate as deploy.yml, using its `deploy-dev <sha>` command.
# dev shares the prod database and .env secrets (its own copy at /opt/fracital/dev/.env); prod is untouched.

name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: terp-deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

env:
  TERP_HOST: 5.188.124.62
  TERP_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIObUWrM7CxDC8VuXpP9FGykhelefOxfFj+cthroe5/c8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      # The build check doesn't need the yt-dlp binary, and its download hits
      # GitHub's unauthenticated API rate limit on shared runners.
      - run: npm ci
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "1"

      - run: npm run build

      - run: test -f dist/index.html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          TERP_DEPLOY_KEY: ${{ secrets.TERP_DEPLOY_KEY }}
        run: |
          if [[ -z "$TERP_DEPLOY_KEY" ]]; then
            echo "::error::TERP_DEPLOY_KEY secret is not set"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TERP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$TERP_HOST $TERP_HOST_KEY" > ~/.ssh/known_hosts

      - name: Deploy ${{ github.sha }} to dev.fracit.al
        run: ssh -o BatchMode=yes "root@$TERP_HOST" deploy-dev "$GITHUB_SHA"
