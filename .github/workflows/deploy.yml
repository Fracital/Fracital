# Build every push to main, then deploy it to terp (5.188.124.62).
#
# TERP_DEPLOY_KEY is an SSH key that terp pins to `/usr/local/sbin/fracital-deploy-gate app`
# (source: deploy/terp-deploy-gate.sh, installed by hand, CI never updates it). The only command it
# accepts is `deploy <sha>`: terp fetches that commit from GitHub, runs npm ci + build in
# /opt/fracital/stage, swaps /opt/fracital/repo to it, restarts pm2 `fracital`, health-checks :8080 and
# rolls back on failure. It refuses to deploy if the live checkout has commits or edits not on GitHub.
# .env on terp is never touched by CI.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: terp-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  TERP_HOST: 5.188.124.62
  TERP_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIObUWrM7CxDC8VuXpP9FGykhelefOxfFj+cthroe5/c8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      # The build check doesn't need the yt-dlp binary, and its download hits
      # GitHub's unauthenticated API rate limit on shared runners.
      - run: npm ci
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "1"

      - run: npm run build

      - run: test -f dist/index.html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          TERP_DEPLOY_KEY: ${{ secrets.TERP_DEPLOY_KEY }}
        run: |
          if [[ -z "$TERP_DEPLOY_KEY" ]]; then
            echo "::error::TERP_DEPLOY_KEY secret is not set"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TERP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$TERP_HOST $TERP_HOST_KEY" > ~/.ssh/known_hosts

      - name: Deploy ${{ github.sha }} to terp
        run: ssh -o BatchMode=yes "root@$TERP_HOST" deploy "$GITHUB_SHA"

      # terp's :80 is not reachable by IP from outside; the gate already health-checks :8080 locally.
      - name: Verify site responds
        run: curl -fsS -m 20 -o /dev/null -w 'site %{http_code}\n' https://fracital.xyz/

      # Deploys change fixed-name assets (/vendor/*.js, sw.js); purge the edge
      # cache so no client gets a stale vendor file against the new app.
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-purge.mjs
